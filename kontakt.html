<body>
  <header>
    <a href="/" class="logo-text">Faindz</a>
  </header>
  <main>
    <h1>Kontakt</h1>
    <p>Fragen, Feedback oder ein Problem mit Faindz? Schreib uns, wir antworten in der Regel innerhalb von 1 bis 2 Werktagen.</p>
    <form id="contactForm" novalidate>
      <label>Name<input name="name" required maxlength="100" autocomplete="name"></label>
      <label>E-Mail<input name="email" type="email" required maxlength="200" autocomplete="email"></label>
      <label>Nachricht<textarea name="message" required minlength="5" maxlength="4000"></textarea></label>
      <div class="hp" aria-hidden="true"><label>Website<input name="website" tabindex="-1" autocomplete="off"></label></div>
      <p class="note">Mit dem Absenden wird deine Nachricht gespeichert, damit wir antworten können. Mehr dazu in der <a href="/datenschutz.html">Datenschutzerklärung</a>.</p>
      <button type="submit">Nachricht senden</button>
      <p class="status" id="status" role="status"></p>
    </form>
    <p style="margin-top:32px">Lieber per E-Mail? <a href="mailto:kontakt@faindz.de">kontakt@faindz.de</a></p>
  </main>
<script src="/vendor/supabase-js.js"></script>
<script>
(function () {
  const sb = window.supabase.createClient('https://isqpkrheevywebkrormc.supabase.co', 'sb_publishable_QjXJAzW3L-W0A_S3KDB_0w_mcdT-J0W', { auth: { persistSession: false } });
  const f = document.getElementById('contactForm'), st = document.getElementById('status'), btn = f.querySelector('button');
  const t0 = Date.now();
  f.addEventListener('submit', async function (e) {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(f));
    if (d.website || Date.now() - t0 < 2500) { st.className = 'status ok'; st.textContent = 'Danke, deine Nachricht ist angekommen.'; f.reset(); return; }
    const name = (d.name || '').trim(), email = (d.email || '').trim(), message = (d.message || '').trim();
    if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || message.length < 5) {
      st.className = 'status err'; st.textContent = 'Bitte Name, eine gültige E-Mail und eine Nachricht angeben.'; return;
    }
    btn.disabled = true; st.className = 'status'; st.textContent = 'Wird gesendet...';
    const { error } = await sb.from('contact_messages').insert({ name, email, message });
    btn.disabled = false;
    if (error) { st.className = 'status err'; st.textContent = 'Das hat nicht geklappt. Bitte schreib uns an kontakt@faindz.de.'; return; }
    st.className = 'status ok'; st.textContent = 'Danke, deine Nachricht ist angekommen. Wir melden uns per E-Mail.'; f.reset();
  });
})();
</script>
</body>
